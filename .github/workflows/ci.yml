name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Migration consistency check
        run: npm run db:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke tests
        run: npm run test:e2e
      - name: Authenticated tenant and idempotency tests
        if: ${{ vars.ENABLE_AUTH_E2E == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          DATABASE_URL_RUNTIME: ${{ secrets.E2E_DATABASE_URL_RUNTIME }}
          DATABASE_URL_UNPOOLED: ${{ secrets.E2E_DATABASE_URL_UNPOOLED }}
          NEON_AUTH_BASE_URL: ${{ secrets.E2E_NEON_AUTH_BASE_URL }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.E2E_NEON_AUTH_COOKIE_SECRET }}
          E2E_TEACHER_EMAIL: ${{ secrets.E2E_TEACHER_EMAIL }}
          E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
          E2E_GUARDIAN_EMAIL: ${{ secrets.E2E_GUARDIAN_EMAIL }}
          E2E_GUARDIAN_PASSWORD: ${{ secrets.E2E_GUARDIAN_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ORGANIZATION_ID: ${{ secrets.E2E_ORGANIZATION_ID }}
          E2E_CLASS_ID: ${{ secrets.E2E_CLASS_ID }}
          E2E_STUDENT_ID: ${{ secrets.E2E_STUDENT_ID }}
          E2E_BEHAVIOR_TEMPLATE_ID: ${{ secrets.E2E_BEHAVIOR_TEMPLATE_ID }}
          E2E_REWARD_ID: ${{ secrets.E2E_REWARD_ID }}
        run: |
          required=(DATABASE_URL NEON_AUTH_BASE_URL NEON_AUTH_COOKIE_SECRET E2E_TEACHER_EMAIL E2E_TEACHER_PASSWORD E2E_GUARDIAN_EMAIL E2E_GUARDIAN_PASSWORD E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD E2E_ORGANIZATION_ID E2E_CLASS_ID E2E_STUDENT_ID E2E_BEHAVIOR_TEMPLATE_ID E2E_REWARD_ID)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing authenticated E2E fixture variable: ${name}" >&2
              exit 1
            fi
          done
          npm run test:e2e -- tests/e2e/authenticated-security.spec.ts
      - name: Authenticated test fixture notice
        if: ${{ vars.ENABLE_AUTH_E2E != 'true' }}
        run: echo "::notice title=Authenticated E2E not enabled::Set repository variable ENABLE_AUTH_E2E=true and the documented E2E secrets to run the authenticated security gate."
      - name: Production build
        run: npm run build
